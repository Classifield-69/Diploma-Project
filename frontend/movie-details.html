<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmSight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <!-- Общи стилове (header, footer, nav) -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Стилове специфични за страницата с детайли на филм -->
    <link rel="stylesheet" href="/static/css/movie-details.css">
    <script src="/static/js/api.js" defer></script>
    <script src="/static/js/reviews.js" defer></script>
    <script src="/static/js/analysis.js" defer></script>
</head>
<body>

    <!-- ── HEADER (същият като index.html) ── -->
    <header class="site-header">
        <nav class="nav">
            <a href="/" class="nav-logo">FilmSight</a>
            <a href="/" class="nav-link">Начало</a>
            <div class="nav-right">
                <a href="/register" class="nav-btn nav-btn--outline">Регистрация</a>
                <a href="/login" class="nav-btn nav-btn--outline">Вход</a>
            </div>
        </nav>
        <div class="nav-tagline">Филмово AI списание</div>
    </header>

    <!-- ── MAIN ── -->
    <main class="main-content">

        <!-- Статус съобщение (зареждане / грешка) — скрива се след успех -->
        <p id="status" class="status-msg">Зареждане...</p>

        <!-- ── FILM HERO: постер вляво, инфо вдясно ── -->
        <section id="movie-info" class="film-hero"></section>

        <!-- ── REVIEWS ── -->
        <div id="reviews-heading" class="section-header" style="display: none;">
            <!-- reviews.js попълва текста динамично -->
        </div>
        <section id="reviews-list" class="reviews-list"></section>

    </main>

    <!-- ── FOOTER ── -->
    <footer class="site-footer">
        <span>© 2026 FilmSight · Всички права запазени</span>
    </footer>

</body>
</html>
