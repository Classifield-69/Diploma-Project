<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>

    <script src="/static/js/api.js" defer></script>
    <script src="/static/js/auth.js" defer></script>
</head>
<body>
    <header>
        <a href="/">← Назад към филмите</a>
    </header>

    <main>
        <h1>Вход в системата</h1>

        <!--
            Form с id за лесно намиране от JavaScript.
            ВАЖНО: НЯМА action или method – submit-ът се обработва от JS.
            Защо все пак <form>, а не <div>? Защото:
            - Enter в input полето автоматично submit-ва формата
            - Браузърите имат accessibility поддръжка за форми
            - Password manager-ите разпознават структурата
        -->
        <form id="login-form">
            <div>
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                >
            </div>

            <div>
                <label for="password">Парола:</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit">Влез</button>
        </form>

        <!-- Място за грешки/успех – auth.js ще го попълни -->
        <p id="status"></p>

        <p>
            Нямаш акаунт? <a href="/register">Регистрирай се</a>
        </p>
    </main>
</body>
</html>
