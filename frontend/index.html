<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Филмови ревюта</title>

    <!--
        Двата JS файла се зареждат в правилния ред:
        1. api.js първо – дефинира fetchMovies(), staticUrl()
        2. main.js след това – ползва тези функции

        defer = браузърът чака HTML-ът да се парсне, после изпълнява JS-а.
        Това позволява <script> в <head>, без да блокираме рендерирането.
    -->
    <script src="/static/js/api.js" defer></script>
    <script src="/static/js/header.js" defer></script>
    <script src="/static/js/main.js" defer></script>
</head>
<body>
    <div id="site-header"></div>

    <header>
        <h1>🎬 Филмови ревюта</h1>
        <p>Система за анализ на филмови ревюта с невронни мрежи</p>
    </header>

    <main>
        <!--
            Тук main.js ще инжектира картите за филмите.
            Контейнерът е празен в HTML-а – пълни се динамично.
        -->
        <section id="movies-grid"></section>
    </main>
</body>
</html>
